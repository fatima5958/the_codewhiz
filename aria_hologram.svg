<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Dark luxury ambient background glow -->
    <radialGradient id="holoGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#581C87" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#09090C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>

    <!-- Glass hologram line gradients -->
    <linearGradient id="glassLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="holoBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="uiPanelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="skinGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Ambient Field -->
  <rect width="800" height="1000" fill="url(#holoGlow)"/>

  <!-- Vertical Holographic Emitter Beams -->
  <g opacity="0.4">
    <polygon points="250,950 550,950 680,200 120,200" fill="url(#holoBeam)"/>
    <line x1="200" y1="950" x2="150" y2="200" stroke="#C084FC" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
    <line x1="600" y1="950" x2="650" y2="200" stroke="#C084FC" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
  </g>

  <!-- ============================================================ -->
  <!-- FLOATING GLASS UI PANELS & WORKFLOW NODES (Surrounding Aria)  -->
  <!-- ============================================================ -->

  <!-- Panel 1: Top Left Workflow Node -->
  <g transform="translate(60, 180)" filter="url(#softGlow)">
    <rect width="180" height="90" rx="10" fill="url(#uiPanelBg)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="24" cy="24" r="5" fill="#C084FC"/>
    <line x1="35" y1="24" x2="160" y2="24" stroke="#E9D5FF" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="24" y1="45" x2="140" y2="45" stroke="#C084FC" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#E9D5FF" letter-spacing="1.5" opacity="0.8">NEURAL SYNAPSE // ACTIVE</text>
    <!-- Connecting line to head -->
    <path d="M180,45 Q260,45 320,240" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
    <circle cx="320" cy="240" r="3" fill="#E9D5FF"/>
  </g>

  <!-- Panel 2: Right Voice Waveform & Metrics -->
  <g transform="translate(560, 240)" filter="url(#softGlow)">
    <rect width="190" height="120" rx="12" fill="url(#uiPanelBg)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#C084FC" letter-spacing="1.5" font-weight="600">ARIA VOICE ENGINE</text>
    <!-- Waveform Bars -->
    <g transform="translate(20, 42)">
      <rect x="0" y="15" width="4" height="20" rx="2" fill="#C084FC" opacity="0.8"/>
      <rect x="8" y="5" width="4" height="40" rx="2" fill="#E9D5FF" opacity="0.9"/>
      <rect x="16" y="20" width="4" height="10" rx="2" fill="#8B5CF6" opacity="0.7"/>
      <rect x="24" y="0" width="4" height="50" rx="2" fill="#E9D5FF"/>
      <rect x="32" y="10" width="4" height="30" rx="2" fill="#C084FC" opacity="0.85"/>
      <rect x="40" y="22" width="4" height="14" rx="2" fill="#8B5CF6" opacity="0.6"/>
      <rect x="48" y="8" width="4" height="34" rx="2" fill="#E9D5FF" opacity="0.9"/>
      <rect x="56" y="18" width="4" height="16" rx="2" fill="#C084FC"/>
      <rect x="64" y="2" width="4" height="46" rx="2" fill="#E9D5FF"/>
      <rect x="72" y="14" width="4" height="22" rx="2" fill="#8B5CF6" opacity="0.8"/>
      <rect x="80" y="22" width="4" height="10" rx="2" fill="#C084FC" opacity="0.5"/>
    </g>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#A78BFA" opacity="0.7">LATENCY: 12ms | SYNC: 99.8%</text>
    <!-- Connecting node -->
    <path d="M0,60 Q-80,60 -120,290" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <circle cx="-120" cy="290" r="3" fill="#E9D5FF"/>
  </g>

  <!-- Panel 3: Bottom Right Automation Workflow Node -->
  <g transform="translate(540, 560)" filter="url(#softGlow)">
    <rect width="200" height="80" rx="10" fill="url(#uiPanelBg)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="24" cy="26" r="6" fill="none" stroke="#E9D5FF" stroke-width="1.5"/>
    <circle cx="24" cy="26" r="2" fill="#E9D5FF"/>
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#FAFAFA" font-weight="500">AUTO-AGENT // V4</text>
    <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#C084FC" opacity="0.8">EXECUTION THREAD: ONLINE</text>
  </g>

  <!-- ============================================================ -->
  <!-- HOLOGRAPHIC FEMALE AI ASSISTANT: ARIA (Front-Facing)          -->
  <!-- ============================================================ -->
  <g id="aria-hologram-portrait">

    <!-- Sub-Glow Aura behind Head & Bust -->
    <ellipse cx="400" cy="440" rx="180" ry="240" fill="url(#skinGlow)"/>

    <!-- Shoulders & Chest Silhouette (Glass Hologram Contour) -->
    <path d="M 220,780 Q 250,680 310,640 Q 360,620 400,620 Q 440,620 490,640 Q 550,680 580,780 C 590,820 600,900 600,950 L 200,950 C 200,900 210,820 220,780 Z" 
          fill="url(#skinGlow)" stroke="url(#glassLine)" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Executive Suit Collar Filaments -->
    <path d="M 330,645 L 400,740 L 470,645" fill="none" stroke="#E9D5FF" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 310,640 L 370,790 M 490,640 L 430,790" fill="none" stroke="#C084FC" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Neck & Throat Wireframe Structure -->
    <path d="M 360,540 C 360,590 370,620 400,625 C 430,620 440,590 440,540 Z" 
          fill="url(#skinGlow)" stroke="url(#glassLine)" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Subtle Throat Light Filament -->
    <line x1="400" y1="540" x2="400" y2="615" stroke="#E9D5FF" stroke-width="1.5" opacity="0.6" filter="url(#softGlow)"/>

    <!-- Jawline & Head Contour -->
    <path d="M 305,380 C 295,460 330,535 400,545 C 470,535 505,460 495,380 C 490,290 460,250 400,250 C 340,250 310,290 305,380 Z" 
          fill="url(#skinGlow)" stroke="url(#glassLine)" stroke-width="1.5" filter="url(#softGlow)"/>

    <!-- Hair Contour (Sleek Futuristic Bob/Flowing Holographic Strands) -->
    <path d="M 290,380 C 280,310 320,230 400,230 C 480,230 520,310 510,380 C 515,440 525,520 535,590 C 490,560 480,480 475,410 C 460,270 340,270 325,410 C 320,480 310,560 265,590 C 275,520 285,440 290,380 Z" 
          fill="none" stroke="#E9D5FF" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)"/>

    <!-- Hair Light Highlights (Flowing Strands) -->
    <path d="M 330,250 Q 310,320 300,430" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.5"/>
    <path d="M 470,250 Q 490,320 500,430" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.5"/>
    <path d="M 360,235 Q 380,300 340,360" fill="none" stroke="#E9D5FF" stroke-width="0.8" opacity="0.6"/>
    <path d="M 440,235 Q 420,300 460,360" fill="none" stroke="#E9D5FF" stroke-width="0.8" opacity="0.6"/>

    <!-- 3D Facial Mesh Lines (Subtle Futuristic Grid) -->
    <g opacity="0.22" stroke="#C084FC" stroke-width="0.5">
      <!-- Horizontal contours -->
      <path d="M 315,350 Q 400,365 485,350" fill="none"/>
      <path d="M 320,390 Q 400,410 480,390" fill="none"/>
      <path d="M 330,440 Q 400,460 470,440" fill="none"/>
      <path d="M 345,490 Q 400,515 455,490" fill="none"/>
      <!-- Vertical contours -->
      <path d="M 360,310 Q 355,410 365,520" fill="none"/>
      <path d="M 400,280 L 400,540" fill="none"/>
      <path d="M 440,310 Q 445,410 435,520" fill="none"/>
    </g>

    <!-- Eyebrows -->
    <path d="M 340,352 Q 365,346 382,354" fill="none" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 460,352 Q 435,346 418,354" fill="none" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- Eyes (Calm, Intelligent, Realistic Geometry) -->
    <!-- Left Eye -->
    <g transform="translate(360, 375)">
      <path d="M -22,0 Q 0,-12 22,0 Q 0,12 -22,0 Z" fill="#0A0A0F" stroke="#E9D5FF" stroke-width="1" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#581C87" stroke="#C084FC" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4" fill="#E9D5FF"/>
      <circle cx="-3" cy="-3" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#C084FC" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.8" filter="url(#neonBlur)"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(440, 375)">
      <path d="M -22,0 Q 0,-12 22,0 Q 0,12 -22,0 Z" fill="#0A0A0F" stroke="#E9D5FF" stroke-width="1" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#581C87" stroke="#C084FC" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4" fill="#E9D5FF"/>
      <circle cx="-3" cy="-3" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#C084FC" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.8" filter="url(#neonBlur)"/>
    </g>

    <!-- Nose Bridge & Tip Contour -->
    <path d="M 400,370 L 400,425 Q 394,432 400,435 Q 406,432 400,425" fill="none" stroke="#E9D5FF" stroke-width="1" opacity="0.6"/>
    <path d="M 390,432 Q 400,437 410,432" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.5"/>

    <!-- Lips (Elegant, Realistic, Lips Sync Anchor Line) -->
    <g id="aria-svg-lips" transform="translate(400, 475)">
      <!-- Upper lip -->
      <path d="M -22,0 Q -10,-6 0,-2 Q 10,-6 22,0 Q 10,2 0,4 Q -10,2 -22,0 Z" 
            fill="#581C87" fill-opacity="0.3" stroke="#E9D5FF" stroke-width="1" stroke-opacity="0.8"/>
      <!-- Lower lip -->
      <path d="M -20,1 Q 0,14 20,1 Q 0,4 -20,1 Z" 
            fill="#8B5CF6" fill-opacity="0.25" stroke="#C084FC" stroke-width="1" stroke-opacity="0.7"/>
      <!-- Mouth line -->
      <line x1="-20" y1="1" x2="20" y2="1" stroke="#E9D5FF" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- Forehead Neural Gem / Interface Node -->
    <circle cx="400" cy="305" r="4" fill="#E9D5FF" filter="url(#neonBlur)"/>
    <circle cx="400" cy="305" r="9" fill="none" stroke="#C084FC" stroke-width="0.8" stroke-dasharray="3 3"/>

  </g>

  <!-- ============================================================ -->
  <!-- FLOATING DIGITAL PARTICLES & LIGHT DATA STREAMS               -->
  <!-- ============================================================ -->
  <g id="particles" opacity="0.7">
    <circle cx="280" cy="220" r="2.5" fill="#E9D5FF" filter="url(#softGlow)"/>
    <circle cx="520" cy="190" r="1.8" fill="#C084FC" filter="url(#softGlow)"/>
    <circle cx="200" cy="450" r="3.0" fill="#8B5CF6" filter="url(#softGlow)"/>
    <circle cx="620" cy="480" r="2.0" fill="#E9D5FF" filter="url(#softGlow)"/>
    <circle cx="330" cy="620" r="1.5" fill="#C084FC"/>
    <circle cx="480" cy="640" r="2.5" fill="#E9D5FF" filter="url(#softGlow)"/>
    <circle cx="150" cy="720" r="2.0" fill="#8B5CF6"/>
    <circle cx="660" cy="750" r="3.2" fill="#C084FC" filter="url(#softGlow)"/>

    <!-- Data stream vertical dashed lines -->
    <line x1="160" y1="100" x2="160" y2="500" stroke="#C084FC" stroke-width="0.6" stroke-dasharray="2 12" opacity="0.4"/>
    <line x1="680" y1="150" x2="680" y2="650" stroke="#E9D5FF" stroke-width="0.6" stroke-dasharray="3 15" opacity="0.4"/>
    <line x1="240" y1="600" x2="240" y2="900" stroke="#8B5CF6" stroke-width="0.6" stroke-dasharray="1 10" opacity="0.3"/>
  </g>

  <!-- Bottom Voice Waveform Graph Overlay -->
  <g transform="translate(250, 910)" opacity="0.8">
    <path d="M 0,20 Q 30,5 60,20 T 120,20 T 180,20 T 240,20 T 300,20" fill="none" stroke="#E9D5FF" stroke-width="1.5" filter="url(#softGlow)"/>
    <path d="M 0,20 Q 45,35 90,20 T 180,20 T 270,20 T 300,20" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
