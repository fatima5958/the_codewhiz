<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Cinematic Lighting & Glass Refraction Gradients -->
    <radialGradient id="chamberLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#6D28D9" stop-opacity="0.12"/>
      <stop offset="90%" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chamberGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Photorealistic Skin Subsurface Scattering -->
    <radialGradient id="realSkinGrad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF3F6"/>
      <stop offset="40%" stop-color="#FFE4E6"/>
      <stop offset="70%" stop-color="#FCD34D" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- UE5 Human Eye Iris Depth -->
    <radialGradient id="realHumanIris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="20%" stop-color="#A855F7"/>
      <stop offset="55%" stop-color="#6B21A8"/>
      <stop offset="85%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Photorealistic Hair Gradients -->
    <linearGradient id="realHairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="35%" stop-color="#0F172A"/>
      <stop offset="80%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="hairSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Executive Designer Suit Outfit -->
    <linearGradient id="suitWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="suitDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cinematic Blur & Glow Filters -->
    <filter id="cinematicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleSkinBlur">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Studio Background -->
  <rect width="600" height="700" fill="#030303"/>
  <circle cx="300" cy="320" r="280" fill="url(#chamberLight)"/>

  <!-- Glass AI Chamber Frame Overlay -->
  <rect x="50" y="40" width="500" height="620" rx="36" fill="url(#chamberGlassGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" filter="url(#cinematicGlow)"/>
  <rect x="52" y="42" width="496" height="616" rx="34" fill="none" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" stroke-dasharray="12 20"/>

  <!-- Holographic Interface Elements inside Chamber -->
  <!-- Left Neural Dashboard Arc -->
  <path d="M 90 200 A 180 180 0 0 1 90 440" stroke="#C084FC" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 8"/>
  <!-- Right Neural Dashboard Arc -->
  <path d="M 510 200 A 180 180 0 0 0 510 440" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 8"/>

  <!-- Aria Photorealistic Hair - Back Volume -->
  <path d="M 150 240 Q 120 440 135 640 L 465 640 Q 480 440 450 240 Z" fill="url(#realHairGrad)"/>
  <path d="M 165 260 Q 135 460 150 640" stroke="url(#hairSpecular)" stroke-width="8" fill="none" opacity="0.5"/>
  <path d="M 435 260 Q 465 460 450 640" stroke="url(#hairSpecular)" stroke-width="8" fill="none" opacity="0.5"/>

  <!-- Delicate Human Neck & Collarbone -->
  <path d="M 255 330 L 255 430 L 345 430 L 345 330 Z" fill="url(#realSkinGrad)"/>
  <path d="M 275 415 Q 300 424 325 415" stroke="#E11D48" stroke-width="1.2" opacity="0.2" fill="none"/>

  <!-- Cybernetic Executive Choker Emblem -->
  <rect x="250" y="390" width="100" height="20" rx="6" fill="#09090B" stroke="#C084FC" stroke-width="1.8"/>
  <circle cx="300" cy="400" r="5" fill="#E9D5FF" filter="url(#cinematicGlow)"/>

  <!-- Executive Suit Jacket & Shoulder Contour -->
  <path d="M 120 540 Q 200 440 255 430 L 345 430 Q 400 440 480 540 L 510 700 L 90 700 Z" fill="url(#suitDarkGrad)"/>
  <!-- White Designer Outer Lapels -->
  <path d="M 90 550 Q 180 455 245 440 L 230 700 L 75 700 Z" fill="url(#suitWhiteGrad)"/>
  <path d="M 510 550 Q 420 455 355 440 L 370 700 L 525 700 Z" fill="url(#suitWhiteGrad)"/>
  <!-- Glowing Violet Lapel Seams -->
  <path d="M 245 440 L 230 700" stroke="#C084FC" stroke-width="3" fill="none" filter="url(#cinematicGlow)"/>
  <path d="M 355 440 L 370 700" stroke="#C084FC" stroke-width="3" fill="none" filter="url(#cinematicGlow)"/>

  <!-- Aria Photorealistic Human Head Contour -->
  <path d="M 195 180 Q 195 300 300 355 Q 405 300 405 180 Q 405 125 300 125 Q 195 125 195 180 Z" fill="url(#realSkinGrad)"/>
  
  <!-- Realistic Cheek Depth & Soft Blush -->
  <ellipse cx="230" cy="275" rx="24" ry="12" fill="#F43F5E" opacity="0.22" filter="url(#subtleSkinBlur)"/>
  <ellipse cx="370" cy="275" rx="24" ry="12" fill="#F43F5E" opacity="0.22" filter="url(#subtleSkinBlur)"/>

  <!-- Human Nose Definition -->
  <path d="M 295 278 L 300 286 L 305 278" stroke="#E11D48" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Photorealistic Natural Lip Contour -->
  <g id="ariaRealLips">
    <path d="M 274 310 Q 300 326 326 310" stroke="#BE123C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 280 310 Q 300 320 320 310" fill="#FB7185" opacity="0.85"/>
    <ellipse cx="300" cy="316" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Left Realistic Eye -->
  <g id="ariaRealLeftEye">
    <!-- Eyelash Contour -->
    <path d="M 215 232 Q 248 212 276 235" stroke="#09090B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 268 222 L 276 235" stroke="#09090B" stroke-width="3.5"/>
    <!-- Iris & Pupil -->
    <ellipse cx="246" cy="248" rx="19" ry="26" fill="url(#realHumanIris)"/>
    <ellipse cx="246" cy="250" rx="10" ry="15" fill="#09090B"/>
    <!-- Realistic Iris Texture & Catchlights -->
    <circle cx="239" cy="238" r="6" fill="#FFFFFF"/>
    <circle cx="255" cy="260" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- Eyebrow -->
    <path d="M 210 210 Q 242 198 274 212" stroke="#334155" stroke-width="3.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Realistic Eye -->
  <g id="ariaRealRightEye">
    <!-- Eyelash Contour -->
    <path d="M 324 235 Q 352 212 385 232" stroke="#09090B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 324 235 L 332 222" stroke="#09090B" stroke-width="3.5"/>
    <!-- Iris & Pupil -->
    <ellipse cx="354" cy="248" rx="19" ry="26" fill="url(#realHumanIris)"/>
    <ellipse cx="354" cy="250" rx="10" ry="15" fill="#09090B"/>
    <!-- Realistic Iris Texture & Catchlights -->
    <circle cx="347" cy="238" r="6" fill="#FFFFFF"/>
    <circle cx="363" cy="260" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- Eyebrow -->
    <path d="M 326 212 Q 358 198 390 210" stroke="#334155" stroke-width="3.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Aria Elegant Hair Bangs & Framed Locks -->
  <path d="M 185 170 Q 245 232 265 178 Q 300 240 335 178 Q 355 232 415 170 Q 400 90 300 90 Q 200 90 185 170 Z" fill="url(#realHairGrad)"/>
  <path d="M 185 165 Q 168 280 190 380 Q 205 380 202 280 Q 198 180 202 165 Z" fill="url(#realHairGrad)"/>
  <path d="M 415 165 Q 432 280 410 380 Q 395 380 398 280 Q 402 180 398 165 Z" fill="url(#realHairGrad)"/>
  
  <!-- Subtle Glowing Highlights in Hair Bangs -->
  <path d="M 210 140 Q 240 205 252 170" stroke="url(#hairSpecular)" stroke-width="5" fill="none" opacity="0.8" filter="url(#cinematicGlow)"/>
  <path d="M 348 170 Q 360 205 390 140" stroke="url(#hairSpecular)" stroke-width="5" fill="none" opacity="0.8" filter="url(#cinematicGlow)"/>

  <!-- Floating Holographic Data Nodes in Chamber -->
  <g opacity="0.85">
    <rect x="75" y="100" width="130" height="36" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="90" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#FAFAFA">⚡ AI AUTOMATION</text>
    
    <rect x="395" y="100" width="130" height="36" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="410" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#FAFAFA">🧠 NEURAL ENGINE</text>

    <rect x="75" y="560" width="140" height="36" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="90" y="582" font-family="sans-serif" font-size="11" font-weight="700" fill="#FAFAFA">📈 BUSINESS GROWTH</text>

    <rect x="385" y="560" width="140" height="36" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <text x="400" y="582" font-family="sans-serif" font-size="11" font-weight="700" fill="#FAFAFA">🌐 SMART SOLUTIONS</text>
  </g>

</svg>
