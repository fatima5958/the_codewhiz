<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 780" width="520" height="780">
  <defs>
    <!-- Cinematic Studio Lighting -->
    <radialGradient id="studioRim" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Realistic Skin with Subsurface Scattering -->
    <radialGradient id="skinBase" cx="48%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFEEF0"/>
      <stop offset="30%" stop-color="#FFE0E3"/>
      <stop offset="60%" stop-color="#F5D0CE"/>
      <stop offset="100%" stop-color="#E8C4C0"/>
    </radialGradient>

    <!-- Eye Iris - Deep Violet -->
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="25%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="80%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>

    <!-- Hair - Rich Dark with Purple Sheen -->
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="30%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>

    <linearGradient id="hairSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Suit Fabric -->
    <linearGradient id="jacketDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <linearGradient id="jacketLapel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="innerTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0A1A"/>
    </linearGradient>

    <!-- Lip Gradient -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="skinSmooth">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="deepShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ========== HAIR BACK VOLUME ========== -->
  <path d="M 100 220 Q 70 400 85 780 L 435 780 Q 450 400 420 220 Z" fill="url(#hairBase)"/>
  <!-- Hair sheen strands -->
  <path d="M 130 280 Q 110 500 120 780" stroke="url(#hairSheen)" stroke-width="12" fill="none" opacity="0.6"/>
  <path d="M 390 280 Q 410 500 400 780" stroke="url(#hairSheen)" stroke-width="12" fill="none" opacity="0.6"/>
  <path d="M 160 300 Q 140 520 150 740" stroke="url(#hairSheen)" stroke-width="6" fill="none" opacity="0.35"/>
  <path d="M 360 300 Q 380 520 370 740" stroke="url(#hairSheen)" stroke-width="6" fill="none" opacity="0.35"/>

  <!-- ========== NECK ========== -->
  <path d="M 215 355 L 215 465 Q 260 480 305 465 L 305 355" fill="url(#skinBase)" filter="url(#skinSmooth)"/>
  <!-- Subtle collarbone shadows -->
  <path d="M 230 445 Q 260 458 290 445" stroke="#D4A0A0" stroke-width="1.2" fill="none" opacity="0.3"/>

  <!-- ========== SUIT BODY ========== -->
  <!-- Dark jacket body -->
  <path d="M 60 580 Q 150 470 215 465 L 305 465 Q 370 470 460 580 L 490 780 L 30 780 Z" fill="url(#jacketDark)"/>

  <!-- White/light lapels -->
  <path d="M 30 590 Q 130 480 205 468 L 185 780 L 15 780 Z" fill="url(#jacketLapel)"/>
  <path d="M 490 590 Q 390 480 315 468 L 335 780 L 505 780 Z" fill="url(#jacketLapel)"/>

  <!-- Glowing lapel seam lines -->
  <path d="M 205 468 L 185 780" stroke="#A78BFA" stroke-width="2.5" fill="none" filter="url(#softGlow)" opacity="0.7"/>
  <path d="M 315 468 L 335 780" stroke="#A78BFA" stroke-width="2.5" fill="none" filter="url(#softGlow)" opacity="0.7"/>

  <!-- Inner dark V-neck top -->
  <path d="M 215 465 L 260 540 L 305 465 Z" fill="url(#innerTop)"/>

  <!-- Cybernetic collar accent -->
  <rect x="210" y="420" width="100" height="16" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5" opacity="0.85"/>
  <circle cx="260" cy="428" r="4" fill="#C4B5FD" filter="url(#softGlow)"/>
  <circle cx="242" cy="428" r="2" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="278" cy="428" r="2" fill="#8B5CF6" opacity="0.6"/>

  <!-- ========== HEAD CONTOUR ========== -->
  <path d="M 155 195 Q 150 125 260 105 Q 370 125 365 195 Q 370 320 260 375 Q 150 320 155 195 Z" fill="url(#skinBase)"/>

  <!-- Jaw definition shadow -->
  <path d="M 175 310 Q 260 385 345 310" stroke="#D4A0A0" stroke-width="1.5" fill="none" opacity="0.2"/>

  <!-- Cheek blush -->
  <ellipse cx="195" cy="290" rx="28" ry="14" fill="#FB7185" opacity="0.15" filter="url(#skinSmooth)"/>
  <ellipse cx="325" cy="290" rx="28" ry="14" fill="#FB7185" opacity="0.15" filter="url(#skinSmooth)"/>

  <!-- Nose -->
  <path d="M 255 285 Q 260 300 265 285" stroke="#C9A0A0" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- Nose bridge highlight -->
  <line x1="260" y1="248" x2="260" y2="280" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- ========== LIPS ========== -->
  <g id="lips">
    <!-- Upper lip -->
    <path d="M 237 325 Q 248 316 260 320 Q 272 316 283 325" fill="url(#lipGrad)" opacity="0.85"/>
    <!-- Lower lip -->
    <path d="M 237 325 Q 260 345 283 325" fill="#FB7185" opacity="0.75"/>
    <!-- Lip shine -->
    <ellipse cx="260" cy="330" rx="8" ry="3" fill="#FFFFFF" opacity="0.4"/>
    <!-- Lip line -->
    <path d="M 237 325 Q 260 322 283 325" stroke="#9F1239" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <!-- ========== LEFT EYE ========== -->
  <g id="leftEye">
    <!-- Eye white -->
    <ellipse cx="215" cy="255" rx="28" ry="18" fill="#FAFAFA"/>
    <!-- Iris -->
    <ellipse cx="215" cy="257" rx="16" ry="18" fill="url(#irisGrad)"/>
    <!-- Pupil -->
    <ellipse cx="215" cy="258" rx="7" ry="9" fill="#09090B"/>
    <!-- Catchlight 1 - main -->
    <circle cx="208" cy="248" r="5.5" fill="#FFFFFF"/>
    <!-- Catchlight 2 - secondary -->
    <circle cx="222" cy="264" r="3" fill="#FFFFFF" opacity="0.8"/>
    <!-- Upper eyelid contour -->
    <path d="M 185 248 Q 215 228 245 250" stroke="#1E1B4B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyelash flick -->
    <path d="M 240 242 L 248 235" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 188 244 L 183 238" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>
    <!-- Lower lash line -->
    <path d="M 190 264 Q 215 274 240 262" stroke="#3B2D5E" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Eyebrow -->
    <path d="M 180 225 Q 215 210 248 228" stroke="#27272A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========== RIGHT EYE ========== -->
  <g id="rightEye">
    <!-- Eye white -->
    <ellipse cx="305" cy="255" rx="28" ry="18" fill="#FAFAFA"/>
    <!-- Iris -->
    <ellipse cx="305" cy="257" rx="16" ry="18" fill="url(#irisGrad)"/>
    <!-- Pupil -->
    <ellipse cx="305" cy="258" rx="7" ry="9" fill="#09090B"/>
    <!-- Catchlight 1 -->
    <circle cx="298" cy="248" r="5.5" fill="#FFFFFF"/>
    <!-- Catchlight 2 -->
    <circle cx="312" cy="264" r="3" fill="#FFFFFF" opacity="0.8"/>
    <!-- Upper eyelid contour -->
    <path d="M 275 250 Q 305 228 335 248" stroke="#1E1B4B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyelash flick -->
    <path d="M 280 242 L 272 235" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 332 244 L 337 238" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>
    <!-- Lower lash line -->
    <path d="M 280 262 Q 305 274 330 264" stroke="#3B2D5E" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Eyebrow -->
    <path d="M 272 228 Q 305 210 340 225" stroke="#27272A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========== HAIR FRONT (BANGS) ========== -->
  <!-- Main bangs shape -->
  <path d="M 140 180 Q 200 255 225 185 Q 245 240 260 180 Q 275 240 295 185 Q 320 255 380 180 Q 375 80 260 65 Q 145 80 140 180 Z" fill="url(#hairBase)"/>

  <!-- Side locks framing face -->
  <path d="M 135 175 Q 115 300 130 440 Q 148 440 145 300 Q 148 195 152 175 Z" fill="url(#hairBase)"/>
  <path d="M 385 175 Q 405 300 390 440 Q 372 440 375 300 Q 372 195 368 175 Z" fill="url(#hairBase)"/>

  <!-- Specular highlights on bangs -->
  <path d="M 168 140 Q 195 220 215 180" stroke="url(#hairSheen)" stroke-width="8" fill="none" opacity="0.7"/>
  <path d="M 305 180 Q 325 220 352 140" stroke="url(#hairSheen)" stroke-width="8" fill="none" opacity="0.7"/>
  <path d="M 240 130 Q 255 175 270 130" stroke="url(#hairSheen)" stroke-width="5" fill="none" opacity="0.5"/>

  <!-- Thin flyaway strands -->
  <path d="M 128 200 Q 120 280 125 360" stroke="#C4B5FD" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 392 200 Q 400 280 395 360" stroke="#C4B5FD" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
